<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fox Manager API – Swagger UI</title>
    <link rel="stylesheet" href="webjars/swagger-ui/5.32.6/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="webjars/swagger-ui/5.32.6/swagger-ui-bundle.js"></script>
<script src="webjars/swagger-ui/5.32.6/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            url: "/openapi?format=JSON",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "StandaloneLayout"
        });
    };
</script>
</body>
</html>
